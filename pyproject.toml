[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modo"
version = "0.3.7"
description = "Compute multi-origin road meeting regions."
authors = [{ name = "Nas Delevski" }]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["geographiclib>=2,<3", "networkx>=3.4,<4", "scipy>=1.12,<2"]

[project.optional-dependencies]
app = ["gunicorn>=26.2,<27"]
test = ["build>=1.2,<2", "pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/adelevski/modo"

[tool.setuptools.package-data]
modo = ["snapshots.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

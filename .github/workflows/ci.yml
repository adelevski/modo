name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install uv==0.12.15
      - run: uv sync --extra app --extra test --locked
      - run: .venv/bin/gunicorn --check-config modo.web:application
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: node --check src/modo/static/app.js
      - run: node --check src/modo/static/leaflet.js
      - run: node --check experiments/browser-routing/site/engine.js
      - run: node --check experiments/browser-routing/site/worker.js
      - run: node --check experiments/browser-routing/site/app.js
      - run: node --check experiments/browser-routing/tests/verify.mjs
      - run: uv run --locked python -m pytest tests experiments
      - run: uv run --locked python -m build
      - if: matrix.python-version == '3.14'
        run: uv run --locked python scripts/fetch_snapshot.py
      - if: matrix.python-version == '3.14'
        run: uv run --locked python scripts/validate_snapshot.py

  scipy-1-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.15
      - run: uv sync --project ci/scipy-1.12 --locked
      - run: uv run --project ci/scipy-1.12 --locked python -m pytest
